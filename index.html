<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>StockWise AI — Indian Stock Research</title>
    <style>
      :root {
        --bg: #f4f6f9; --surface: #ffffff; --surface-alt: #f8fafc;
        --ink: #0f172a; --ink-muted: #475569; --border: #e2e8f0;
        --primary: #0f766e; --accent: #1d4ed8;
        --good: #059669; --good-soft: #d1fae5;
        --warn: #b45309; --warn-soft: #fef3c7;
        --bad: #dc2626; --bad-soft: #fee2e2;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; font-size: 16px; }
      .app-shell { max-width: 600px; margin: 0 auto; min-height: 100dvh; padding-bottom: 84px; background: var(--bg); }
      .top-bar { position: sticky; top: 0; z-index: 20; background: #0f172a; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
      .brand-title { font-size: 1.1rem; font-weight: 700; }
      .brand-subtitle { font-size: 0.72rem; color: #94a3b8; }
      .sample-banner { background: var(--warn-soft); color: #78350f; border-bottom: 1px solid #fcd34d; padding: 8px 14px; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .page-content { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(15,23,42,0.05); }
      .card-title { margin: 0 0 10px 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 10px 14px; }
      .search-box:focus-within { border-color: var(--primary); }
      .search-input { border: none; outline: none; width: 100%; font-size: 1rem; background: transparent; color: var(--ink); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .mode-btn { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--surface); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 88px; }
      .mode-btn.active { border: 2px solid var(--primary); background: #f0fdfa; }
      .mode-label { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
      .mode-desc { font-size: 0.78rem; color: var(--ink-muted); }
      .horiz-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
      .index-pill { min-width: 148px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; flex-shrink: 0; }
      .stock-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; min-height: 56px; }
      .stock-row:last-child { border-bottom: none; padding-bottom: 0; }
      .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
      .badge-good { background: var(--good-soft); color: var(--good); }
      .badge-warn { background: var(--warn-soft); color: var(--warn); }
      .badge-bad { background: var(--bad-soft); color: var(--bad); }
      .badge-neutral { background: #e2e8f0; color: #334155; }
      .positive { color: var(--good); font-weight: 700; }
      .negative { color: var(--bad); font-weight: 700; }
      .score-card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
      .helper-box { margin-top: 8px; padding: 8px 10px; background: #eff6ff; border-left: 3px solid var(--accent); border-radius: 8px; font-size: 0.8rem; color: #1e3a8a; }
      .btn { border: none; border-radius: 12px; padding: 12px 16px; font-size: 0.95rem; font-weight: 700; cursor: pointer; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-outline { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
      .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
      .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
      .fact-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; }
      .ai-box { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 12px; padding: 12px; }
      .table-scroll { overflow-x: auto; }
      table.simple-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      table.simple-table th, table.simple-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
      .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px env(safe-area-inset-bottom); z-index: 30; }
      .nav-item { border: none; background: transparent; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
      .nav-item.active { color: var(--primary); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
